name: Verify store automation interface
on:
  push:
    paths:
      - 'app/store-tools*'
      - 'deploy/*store-tools*'
      - 'app/app.js'
      - 'scripts/verify-store-tools-browser.cjs'
      - '.github/workflows/store-tools-ui.yml'
permissions:
  contents: read
jobs:
  store-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/store-tools.test.mjs app/app.test.mjs app/messages.test.mjs
      - run: python3 deploy/stage-store-tools-ui.test.py
      - name: Verify store controls in desktop and mobile Chrome
        run: |
          browser_deps="$RUNNER_TEMP/zetslay-store-tools-browser"
          npm install --prefix "$browser_deps" --no-save --ignore-scripts playwright@1.56.1
          ZETSLAY_PLAYWRIGHT_MODULE="$browser_deps/node_modules/playwright" ZETSLAY_TEST_BROWSER_PATH="$(command -v google-chrome)" ZETSLAY_BROWSER_OUTPUT="$RUNNER_TEMP/store-tools-previews" node scripts/verify-store-tools-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-tools-previews
          path: ${{ runner.temp }}/store-tools-previews/
          retention-days: 7
