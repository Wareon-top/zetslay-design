name: Verify working bot settings
on:
  push:
    paths:
      - 'app/bot-settings*'
      - 'app/profile.js'
      - 'deploy/*bot-settings*'
      - 'scripts/verify-bot-settings-browser.cjs'
      - '.github/workflows/bot-settings-ui.yml'
permissions:
  contents: read
jobs:
  bot-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/bot-settings.test.mjs app/profile.test.mjs
      - run: python3 deploy/stage-bot-settings-ui.test.py
      - name: Verify profile settings in desktop and mobile Chrome
        run: |
          browser_deps="$RUNNER_TEMP/zetslay-bot-settings-browser"
          npm install --prefix "$browser_deps" --no-save --ignore-scripts playwright@1.56.1
          ZETSLAY_PLAYWRIGHT_MODULE="$browser_deps/node_modules/playwright" ZETSLAY_TEST_BROWSER_PATH="$(command -v google-chrome)" ZETSLAY_BROWSER_OUTPUT="$RUNNER_TEMP/bot-settings-previews" node scripts/verify-bot-settings-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-settings-previews
          path: ${{ runner.temp }}/bot-settings-previews/
          retention-days: 7
