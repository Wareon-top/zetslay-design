name: KOSELL guided workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/kosell-rent.test.mjs app/kosell-storefront.test.mjs
      - run: python3 deploy/stage-kosell-workspace.test.py -v
      - run: bash -n deploy/start-kosell-workspace.sh deploy/update-kosell-workspace-ui.sh
