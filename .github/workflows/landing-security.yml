name: Landing security design
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  safe-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 deploy/stage-landing-security.test.py -v
      - run: python3 deploy/stage-trust-foundation.test.py -v
      - run: bash -n deploy/update-landing-security.sh
