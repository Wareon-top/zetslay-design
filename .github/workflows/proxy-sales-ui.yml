name: Verify proxy shop interface
on:
  push:
    paths:
      - 'app/proxy-shop*'
      - 'app/managed-proxy-ui*'
      - 'deploy/*proxy-sales*'
      - 'scripts/verify-proxy-shop-browser.cjs'
      - '.github/workflows/proxy-sales-ui.yml'
permissions:
  contents: read
jobs:
  proxy-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/proxy-shop.test.mjs app/managed-proxy-ui.test.mjs app/payments.test.mjs
      - run: python3 deploy/stage-proxy-sales-ui.test.py
      - name: Verify proxy checkout in desktop and mobile Chrome
        run: |
          browser_deps="$RUNNER_TEMP/zetslay-proxy-browser"
          npm install --prefix "$browser_deps" --no-save --ignore-scripts playwright@1.56.1
          ZETSLAY_PLAYWRIGHT_MODULE="$browser_deps/node_modules/playwright" ZETSLAY_TEST_BROWSER_PATH="$(command -v google-chrome)" ZETSLAY_BROWSER_OUTPUT="$RUNNER_TEMP/proxy-shop-previews" node scripts/verify-proxy-shop-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-shop-previews
          path: ${{ runner.temp }}/proxy-shop-previews/
          retention-days: 7
