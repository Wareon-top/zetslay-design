name: Public security page
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  page-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test security/security.test.mjs
      - run: python3 deploy/stage-security-page.test.py -v
      - run: python3 deploy/stage-trust-foundation.test.py -v
      - run: bash -n deploy/update-security-page.sh
