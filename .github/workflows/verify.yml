name: Verify cabinet and landing
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test --test-concurrency=2 --test-reporter=tap app/*.test.mjs *.test.mjs
      - run: python3 deploy/stage-reliability.test.py
      - run: python3 deploy/stage-managed-proxy.test.py
      - run: node scripts/validate-project.mjs
      - run: python3 deploy/stage-messages-workspace.test.py
      - run: python3 deploy/stage-messages-ui.test.py
      - run: python3 deploy/stage-priority-orders.test.py
      - run: python3 deploy/stage-service-access-policy.test.py
      - run: python3 deploy/stage-order-chronology.test.py
